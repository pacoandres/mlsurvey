; Subida de ficheros adjuntos a las encuestas.
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

date.timezone = UTC
expose_php = Off

; Sin error_log explicito PHP escribe en stderr => visible con "docker compose logs".
log_errors = On
display_errors = Off

session.cookie_httponly = 1
session.use_strict_mode = 1
