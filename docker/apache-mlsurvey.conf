# El .htaccess del proyecto hace el enrutado (index.php?view=...), hace falta AllowOverride.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Codigo del servidor: se incluye desde index.php, nunca debe servirse por HTTP.
<DirectoryMatch "^/var/www/html/(config|include|utils|ifaces|views)">
    Require all denied
</DirectoryMatch>

# Los ficheros subidos se sirven, pero nunca se ejecutan.
<Directory /var/www/html/files>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    AllowOverride None
</Directory>
